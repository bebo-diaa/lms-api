openapi: 3.0.3

info:
  title: LMS API
  version: 1.0.0
  description: |
    A RESTful Learning Management System API built with Node.js, Express.js,
    MongoDB, and Mongoose.

    The API provides authentication, user management, course management,
    lessons, enrollments, progress tracking, reviews, favorites,
    instructor dashboard functionality, and Stripe payments.

servers:
  - url: http://localhost:4000
    description: Local development server

tags:
  - name: Authentication
    description: User registration and authentication
  - name: Users
    description: User management
  - name: Courses
    description: Course management and discovery
  - name: Lessons
    description: Course lessons
  - name: Enrollment
    description: Course enrollment
  - name: Progress
    description: Student course progress
  - name: Reviews
    description: Course reviews
  - name: Favorites
    description: Favorite courses
  - name: Instructor
    description: Instructor dashboard
  - name: Payment
    description: Stripe payment and checkout

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT


  parameters:

    CourseId:
      name: courseId
      in: path
      required: true
      description: Course ID
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{24}$'
        example: 65f1a2b3c4d5e6f789012345

    LessonId:
      name: lessonId
      in: path
      required: true
      description: Lesson ID
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{24}$'
        example: 65f1a2b3c4d5e6f789012346

    UserId:
      name: userId
      in: path
      required: true
      description: User ID
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{24}$'
        example: 65f1a2b3c4d5e6f789012347

    ReviewId:
      name: reviewId
      in: path
      required: true
      description: Review ID
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{24}$'
        example: 65f1a2b3c4d5e6f789012348

    Page:
      name: page
      in: query
      required: false
      description: Page number
      schema:
        type: integer
        minimum: 1
        default: 1
        example: 1

    Limit:
      name: limit
      in: query
      required: false
      description: Number of results per page
      schema:
        type: integer
        minimum: 1
        example: 10


  schemas:

    User:
      type: object
      properties:
        _id:
          type: string
          example: 65f1a2b3c4d5e6f789012345
        firstName:
          type: string
          example: Ahmed
        lastName:
          type: string
          example: Mohamed
        email:
          type: string
          format: email
          example: ahmed@example.com
        role:
          type: string
          enum:
            - student
            - instructor
            - admin
          example: student
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time


    PublicUser:
      type: object
      properties:
        firstName:
          type: string
          example: Ahmed
        lastName:
          type: string
          example: Mohamed
        email:
          type: string
          format: email
          example: ahmed@example.com


    UserSummary:
      type: object
      properties:
        _id:
          type: string
          example: 65f1a2b3c4d5e6f789012345
        firstName:
          type: string
          example: Ahmed
        lastName:
          type: string
          example: Mohamed
        email:
          type: string
          format: email
          example: ahmed@example.com


    InstructorSummary:
      type: object
      properties:
        _id:
          type: string
          example: 65f1a2b3c4d5e6f789012345
        firstName:
          type: string
          example: Ahmed
        lastName:
          type: string
          example: Mohamed
        email:
          type: string
          format: email
          example: ahmed@example.com


    RegisterRequest:
      type: object
      required:
        - firstName
        - lastName
        - email
        - password
      properties:
        firstName:
          type: string
          example: Ahmed
        lastName:
          type: string
          example: Mohamed
        email:
          type: string
          format: email
          example: ahmed@example.com
        password:
          type: string
          format: password
          minLength: 8
          example: password123


    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: ahmed@example.com
        password:
          type: string
          format: password
          example: password123


    RegisterResponse:
      type: object
      properties:
        firstName:
          type: string
          example: Ahmed
        lastName:
          type: string
          example: Mohamed
        email:
          type: string
          format: email
          example: ahmed@example.com
        role:
          type: string
          enum:
            - student
          example: student
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time


    LoginResponse:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...


    UserByIdResponse:
      type: object
      properties:
        userId:
          type: string
          example: 65f1a2b3c4d5e6f789012345
        firstName:
          type: string
          example: Ahmed
        lastName:
          type: string
          example: Mohamed
        email:
          type: string
          format: email
          example: ahmed@example.com


    UserListResponse:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/User'
        pagination:
          type: object
          properties:
            page:
              type: integer
              example: 1
            limit:
              type: integer
              example: 10
            totalPages:
              type: integer
              example: 5
            totalUsers:
              type: integer
              example: 50


    Course:
      type: object
      properties:
        _id:
          type: string
          example: 65f1a2b3c4d5e6f789012345
        title:
          type: string
          example: Node.js Basics
        description:
          type: string
          example: Learn the fundamentals of Node.js
        price:
          type: number
          minimum: 0
          example: 199
        category:
          type: string
          enum:
            - programming
            - design
            - marketing
            - business
            - languages
            - personal-development
          example: programming
        instructor:
          type: string
          example: 65f1a2b3c4d5e6f789012346
        published:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time


    CoursePopulated:
      type: object
      properties:
        _id:
          type: string
          example: 65f1a2b3c4d5e6f789012345
        title:
          type: string
          example: Node.js Basics
        description:
          type: string
          example: Learn the fundamentals of Node.js
        price:
          type: number
          minimum: 0
          example: 199
        category:
          type: string
          enum:
            - programming
            - design
            - marketing
            - business
            - languages
            - personal-development
          example: programming
        instructor:
          $ref: '#/components/schemas/InstructorSummary'
        published:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time


    CreateCourseRequest:
      type: object
      required:
        - title
        - description
        - price
        - category
      properties:
        title:
          type: string
          example: Node.js Basics
        description:
          type: string
          example: Learn the fundamentals of Node.js
        price:
          type: number
          minimum: 0
          example: 199
        category:
          type: string
          enum:
            - programming
            - design
            - marketing
            - business
            - languages
            - personal-development
          example: programming


    UpdateCourseRequest:
      type: object
      properties:
        title:
          type: string
          example: Advanced Node.js
        description:
          type: string
          example: Advanced Node.js backend concepts
        price:
          type: number
          minimum: 0
          example: 299
        category:
          type: string
          enum:
            - programming
            - design
            - marketing
            - business
            - languages
            - personal-development
          example: programming
        published:
          type: boolean
          example: true


    CourseFilters:
      type: object
      properties:
        category:
          type: string
          nullable: true
          enum:
            - programming
            - design
            - marketing
            - business
            - languages
            - personal-development
          example: programming
        search:
          type: string
          nullable: true
          example: node
        sort:
          type: string
          nullable: true
          enum:
            - price
            - title
            - createdAt
          example: createdAt
        order:
          type: string
          nullable: true
          enum:
            - asc
            - desc
          example: desc


    CourseLessonSummary:
      type: object
      properties:
        _id:
          type: string
          example: 65f1a2b3c4d5e6f789012347
        title:
          type: string
          example: Introduction
        order:
          type: integer
          example: 1


    CourseListResponse:
      type: object
      properties:
        courses:
          type: array
          items:
            $ref: '#/components/schemas/CoursePopulated'
        pagination:
          type: object
          properties:
            totalCourses:
              type: integer
              example: 20
            page:
              type: integer
              example: 1
            limit:
              type: integer
              example: 10
            totalPages:
              type: integer
              example: 2
        filters:
          $ref: '#/components/schemas/CourseFilters'


    MyCoursesResponse:
      type: object
      properties:
        courses:
          type: array
          items:
            $ref: '#/components/schemas/CoursePopulated'


    CourseDetailsResponse:
      type: object
      properties:
        course:
          $ref: '#/components/schemas/CoursePopulated'
        lessons:
          type: array
          items:
            $ref: '#/components/schemas/CourseLessonSummary'


    DeleteCourseResponse:
      type: object
      properties:
        course:
          $ref: '#/components/schemas/Course'
        message:
          type: string
          example: Course deleted successfully


    Lesson:
      type: object
      properties:
        _id:
          type: string
          example: 65f1a2b3c4d5e6f789012348
        title:
          type: string
          example: Introduction
        videoUrl:
          type: string
          example: /uploads/videos/introduction.mp4
        course:
          type: string
          example: 65f1a2b3c4d5e6f789012345
        order:
          type: integer
          example: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time


    CreateLessonRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          example: Introduction
        video:
          type: string
          format: binary
          description: Video file to upload.
        videoUrl:
          type: string
          description: Optional video URL used when no video file is uploaded.
          example: https://example.com/videos/introduction.mp4


    LessonsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Lesson'


    Enrollment:
      type: object
      properties:
        _id:
          type: string
          example: 65f1a2b3c4d5e6f789012349
        student:
          type: string
          example: 65f1a2b3c4d5e6f789012345
        course:
          type: string
          example: 65f1a2b3c4d5e6f789012346
        status:
          type: string
          enum:
            - pending
            - success
            - failed
          example: success
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time


    EnrollmentPopulated:
      type: object
      properties:
        _id:
          type: string
          example: 65f1a2b3c4d5e6f789012349
        student:
          type: string
          example: 65f1a2b3c4d5e6f789012345
        course:
          $ref: '#/components/schemas/CoursePopulated'
        status:
          type: string
          enum:
            - pending
            - success
            - failed
          example: success
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time


    EnrollmentResponse:
      type: object
      properties:
        enrollment:
          $ref: '#/components/schemas/Enrollment'


    MyEnrollmentsResponse:
      type: object
      properties:
        enrollments:
          type: array
          items:
            $ref: '#/components/schemas/EnrollmentPopulated'
        pagination:
          type: object
          properties:
            page:
              type: integer
              example: 1
            limit:
              type: integer
              example: 10
            totalEnrollments:
              type: integer
              example: 20
            totalPages:
              type: integer
              example: 2


    Payment:
      type: object
      properties:
        _id:
          type: string
          example: 65f1a2b3c4d5e6f789012350
        student:
          type: string
          example: 65f1a2b3c4d5e6f789012345
        course:
          type: string
          example: 65f1a2b3c4d5e6f789012346
        enrollment:
          type: string
          example: 65f1a2b3c4d5e6f789012349
        stripeSessionId:
          type: string
          example: cs_test_a1b2c3d4
        stripeEventId:
          type: string
          nullable: true
          example: evt_123456789
        amount:
          type: number
          minimum: 0
          example: 199
        currency:
          type: string
          example: usd
        status:
          type: string
          enum:
            - pending
            - success
            - failed
            - canceled
          example: success
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time


    PaymentCheckoutResponse:
      type: object
      properties:
        checkoutUrl:
          type: string
          example: https://checkout.stripe.com/c/pay/cs_test_...


    PaymentWebhookResponse:
      type: object
      properties:
        received:
          type: boolean
          example: true


    Progress:
      type: object
      properties:
        _id:
          type: string
          example: 65f1a2b3c4d5e6f789012351
        student:
          type: string
          example: 65f1a2b3c4d5e6f789012345
        lesson:
          type: string
          example: 65f1a2b3c4d5e6f789012348
        course:
          type: string
          example: 65f1a2b3c4d5e6f789012346
        completed:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time


    ProgressResponse:
      type: object
      properties:
        progress:
          $ref: '#/components/schemas/Progress'


    CourseProgressResponse:
      type: object
      properties:
        progressPercentage:
          type: number
          minimum: 0
          maximum: 100
          example: 75


    Review:
      type: object
      properties:
        _id:
          type: string
          example: 65f1a2b3c4d5e6f789012352
        user:
          type: string
          example: 65f1a2b3c4d5e6f789012345
        course:
          type: string
          example: 65f1a2b3c4d5e6f789012346
        rating:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        comment:
          type: string
          example: Excellent course!
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time


    ReviewPopulated:
      type: object
      properties:
        _id:
          type: string
          example: 65f1a2b3c4d5e6f789012352
        user:
          $ref: '#/components/schemas/UserSummary'
        course:
          type: string
          example: 65f1a2b3c4d5e6f789012346
        rating:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        comment:
          type: string
          example: Excellent course!
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time


    CreateReviewRequest:
      type: object
      required:
        - courseId
        - rating
      properties:
        courseId:
          type: string
          example: 65f1a2b3c4d5e6f789012346
        rating:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        comment:
          type: string
          example: Excellent course!


    UpdateReviewRequest:
      type: object
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
          example: 4
        comment:
          type: string
          example: Very good course.


    ReviewListResponse:
      type: object
      properties:
        reviews:
          type: array
          items:
            $ref: '#/components/schemas/ReviewPopulated'


    Favorite:
      type: object
      properties:
        _id:
          type: string
          example: 65f1a2b3c4d5e6f789012353
        student:
          type: string
          example: 65f1a2b3c4d5e6f789012345
        course:
          type: string
          example: 65f1a2b3c4d5e6f789012346
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time


    FavoriteCourseSummary:
      type: object
      properties:
        _id:
          type: string
          example: 65f1a2b3c4d5e6f789012346
        title:
          type: string
          example: Node.js Basics
        category:
          type: string
          enum:
            - programming
            - design
            - marketing
            - business
            - languages
            - personal-development
          example: programming


    FavoritePopulated:
      type: object
      properties:
        _id:
          type: string
          example: 65f1a2b3c4d5e6f789012353
        student:
          type: string
          example: 65f1a2b3c4d5e6f789012345
        course:
          $ref: '#/components/schemas/FavoriteCourseSummary'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time


    FavoriteResponse:
      type: object
      properties:
        favorite:
          $ref: '#/components/schemas/Favorite'


    FavoritesResponse:
      type: object
      properties:
        favorites:
          type: array
          items:
            $ref: '#/components/schemas/FavoritePopulated'


    DashboardResponse:
      type: object
      properties:
        totalCourses:
          type: integer
          example: 10
        totalCoursesPublished:
          type: integer
          example: 7
        totalCoursesUnPublished:
          type: integer
          example: 3
        totalStudents:
          type: integer
          example: 150
        totalReviews:
          type: integer
          example: 80
        averageRating:
          type: number
          example: 4.5

    CourseResponse:
      type: object
      properties:
        course:
          $ref: '#/components/schemas/Course'


    LessonResponse:
      type: object
      properties:
        newLesson:
          $ref: '#/components/schemas/Lesson'


    ReviewResponse:
      type: object
      properties:
        review:
          $ref: '#/components/schemas/Review'


    DeleteReviewResponse:
      type: object
      properties:
        message:
          type: string
          example: Review deleted successfully
        review:
          $ref: '#/components/schemas/Review'


    DeleteFavoriteResponse:
      type: object
      properties:
        favorite:
          $ref: '#/components/schemas/Favorite'



    Error:
      type: object
      required:
        - status
        - message
      properties:
        status:
          type: string
          example: error
        message:
          type: string
          example: Something went wrong


paths:
  /api/users/register:
    post:
      tags:
        - Authentication
      operationId: registerUser
      summary: Register a new user
      description: Creates a new user account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: User already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/users/login:
    post:
      tags:
        - Authentication
      operationId: loginUser
      summary: Login user
      description: Authenticates a user and returns a JWT token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/users/:
    get:
      tags:
        - Users
      operationId: getAllUsers
      summary: Get all users
      description: Returns a paginated list of users for administrators.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Users retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/users/me:
    get:
      tags:
        - Users
      operationId: getCurrentUser
      summary: Get current authenticated user
      description: Returns the profile of the currently authenticated user.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicUser'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/users/{userId}:
    get:
      tags:
        - Users
      operationId: getUserById
      summary: Get user by ID
      description: Returns a user by ID. Administrator access is required.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserByIdResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'



  /api/courses/:
    get:
      tags:
        - Courses
      operationId: getAllCourses
      summary: Get published courses
      description: |
        Returns published courses with pagination.

        Supports category filtering, title search, sorting, and pagination.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: category
          in: query
          description: Filter courses by category
          schema:
            type: string
            enum:
              - programming
              - design
              - marketing
              - business
              - languages
              - personal-development
            example: programming
        - name: search
          in: query
          description: Search courses by title
          schema:
            type: string
            example: Node
        - name: sort
          in: query
          description: Field used for sorting
          schema:
            type: string
            enum:
              - price
              - title
              - createdAt
            example: createdAt
        - name: order
          in: query
          description: Sorting direction
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
            example: desc
      responses:
        '200':
          description: Courses retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseListResponse'
        '400':
          description: Invalid sorting parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

